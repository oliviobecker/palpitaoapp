<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Default (English) product name; LanguageService updates it per language. -->
    <title>FanPicks</title>
    <meta name="description" content="FanPicks — football predictions with friends." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d6efd" />

    <!-- Link preview. The public standings link (/p/<key>) is meant to be pasted into a
         WhatsApp group, and the unfurl is the whole first impression. Deliberately generic:
         the crawler does not run JS, so it can never see a season anyway, and a card that
         named the group or a participant would leak exactly what `noindex` protects.
         The image path is root-relative; if a crawler ever refuses it, make it absolute
         with the deployed origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FanPicks" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Palpitão · classificação do bolão" />
    <meta
      property="og:description"
      content="A classificação do bolão e a pontuação de cada jogo, aberta para conferir."
    />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Palpitão" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash of the
      // light theme. ThemeService takes over once Angular boots. Keep in sync with
      // THEME_STORAGE_KEY in core/theme/theme.service.ts.
      (function () {
        try {
          var t = localStorage.getItem('palpitao.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-bs-theme', t);
        } catch (e) {
          /* localStorage/matchMedia unavailable — default light. */
        }
      })();
    </script>
    <!-- PWA manifest. Product name is FanPicks (en); in-app branding still switches
         per language (Palpitão in pt-BR) via the app.name translation. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
