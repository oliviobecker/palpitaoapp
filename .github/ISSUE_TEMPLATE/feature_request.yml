name: Feature request
description: Suggest a change to the app or to how a pool is run.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today, and for whom (participant, group admin)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Mention any pool rule it touches (scoring, absences, Flávio Rule…).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
