name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. Jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/Palpitao.slnx

      - name: Build
        run: dotnet build backend/Palpitao.slnx --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test backend/Palpitao.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage"
          --logger "trx;LogFileName=results.trx"

      # The model must match the migrations: a change to an entity without its migration fails
      # here instead of in the deploy. Needs no database.
      - name: No pending EF Core model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project backend/src/Palpitao.Infrastructure --startup-project backend/src/Palpitao.Api --no-build --configuration Release

      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
          targetdir: ${{ runner.temp }}/coverage-report
          reporttypes: MarkdownSummaryGithub;HtmlInline
          assemblyfilters: '-*.Tests'
          classfilters: '-Palpitao.Infrastructure.Persistence.Migrations.*'

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: cat "${{ runner.temp }}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/coverage-report/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (format + lint + build + unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        shell: bash
        run: |
          # Pinned release of the official download script and binary, rather than whatever
          # is on actionlint's main branch.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
